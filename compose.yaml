name: nexus
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: nexus
      POSTGRES_DB: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_local}
    ports: ["127.0.0.1:5437:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      retries: 15
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6387:6379"]
    volumes: ["redis_data:/data"]
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1027:1025", "127.0.0.1:8027:8025"]
    restart: unless-stopped
  api:
    profiles: ["app"]
    build: ./server
    env_file: .env
    environment: &server-env
      NODE_ENV: production
      DATABASE_URL: postgres://nexus:${POSTGRES_PASSWORD:-nexus_local}@postgres:5432/nexus
      REDIS_URL: redis://redis:6379
      FILE_ROOT: /data/files
      PORT: 3001
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    volumes: ["source_files:/data/files"]
    restart: unless-stopped
  worker:
    profiles: ["app"]
    build: ./server
    command: ["npm", "run", "worker:prod"]
    env_file: .env
    environment: *server-env
    depends_on: [api]
    volumes: ["source_files:/data/files"]
    restart: unless-stopped
  web:
    profiles: ["app"]
    build: .
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports: ["80:80", "443:443"]
    depends_on: [api]
    volumes: ["caddy_data:/data"]
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  source_files:
  caddy_data:
